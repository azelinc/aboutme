<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azlysyam Fauzi - About Me</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            position: relative;
        }
        /* Background Animation Canvas */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
            border-radius: 10px;
        }
        /* ECG Animation Styles */
        .ecg-container {
            width: 100%;
            height: 60px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .ecg-svg {
            width: 100%;
            height: 100%;
            stroke: #000000;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawECG 2s linear infinite;
        }
        @keyframes drawECG {
            to {
                stroke-dashoffset: 0;
            }
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        p {
            font-size: 1.1rem;
            color: #333333;
            margin-bottom: 30px;
        }
        .role {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }
        .contact {
            margin-top: 40px;
            border-top: 1px solid #000000;
            padding-top: 20px;
        }
        .contact a {
            color: #000000;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        /* Dark Mode Toggle - Text Only */
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 0;
            background-color: transparent;
            color: #000000;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            z-index: 1000;
            text-decoration: underline;
        }
        body.dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        body.dark-mode #bg-canvas {
            opacity: 0.2;
        }
        body.dark-mode .container {
            background: rgba(0, 0, 0, 0.8);
        }
        body.dark-mode p {
            color: #cccccc;
        }
        body.dark-mode .contact {
            border-top: 1px solid #ffffff;
        }
        body.dark-mode .contact a {
            color: #ffffff;
        }
        body.dark-mode #theme-toggle {
            color: #ffffff;
        }
        body.dark-mode .ecg-svg {
            stroke: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Background Animation -->
    <canvas id="bg-canvas"></canvas>

    <button id="theme-toggle">Dark Mode</button>
    <div class="container">
        <!-- ECG Animation -->
        <div class="ecg-container">
            <svg class="ecg-svg" viewBox="0 0 500 100" preserveAspectRatio="none">
                <path d="M0,50 L50,50 L60,40 L70,60 L80,10 L90,90 L100,50 L150,50 L160,40 L170,60 L180,10 L190,90 L200,50 L500,50" />
            </svg>
        </div>
        <h1>Azlysyam Fauzi</h1>
        <span class="role">Instrument & Control Engineer</span>
        <p>
            Ensuring operational reliability and safety through precision instrumentation and control systems.
        </p>
        <div class="contact">
            <a href="mailto:azlysyam@gmail.com">Email</a>
            <a href="https://www.linkedin.com/in/azlysyam-fauzi-55a09734/">LinkedIn</a>
        </div>
    </div>
    <script>
        // Dark Mode Toggle
        const toggleButton = document.getElementById('theme-toggle');
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                toggleButton.textContent = 'Light Mode';
            } else {
                toggleButton.textContent = 'Dark Mode';
            }
        });

        // Background Animation (Connected Nodes)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.size = Math.random() * 2 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('dark-mode') ? '#ffffff' : '#000000';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const numberOfParticles = Math.floor((canvas.width * canvas.height) / 15000);
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.strokeStyle = document.body.classList.contains('dark-mode') ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }

        initParticles();
        animate();
    </script>
</body>
</html>
