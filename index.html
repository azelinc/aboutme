<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .profile { text-align: center; margin-bottom: 40px; }
        .profile img { width: 150px; height: 150px; border-radius: 50%; border: 3px solid #4a4a6a; }
        h1 { color: #00d9ff; margin: 20px 0 10px; }
        .bio { color: #aaa; line-height: 1.6; }
        .ecg-container { height: 100px; background: #0f0f1a; border-radius: 10px; margin: 30px 0; overflow: hidden; position: relative; }
        .ecg-line { position: absolute; height: 2px; background: #00ff88; width: 100%; top: 50%; animation: ecg 2s linear infinite; }
        @keyframes ecg { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
        .nodes { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .node { width: 12px; height: 12px; background: #4a4a6a; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite; }
        .node:nth-child(2) { animation-delay: 0.3s; }
        .node:nth-child(3) { animation-delay: 0.6s; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <img src="profile.jpg" alt="Profile">
            <h1>Welcome</h1>
            <p class="bio">Developer | Designer | Creator</p>
        </div>
        <div class="ecg-container">
            <div class="ecg-line"></div>
        </div>
        <div class="nodes">
            <div class="node"></div>
            <div class="node"></div>
            <div class="node"></div>
        </div>
    </div>
    <script>
        setInterval(() => {
            document.body.style.background = document.body.style.background === 'rgb(26, 26, 46)' ? '#1a2e2e' : '#1a1a2e';
        }, 10000);
    </script>
</body>
</html>
