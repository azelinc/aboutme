<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azlysyam Fauzi - About Me</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            text-align: center;
        }
        /* ECG Animation Styles */
        .ecg-container {
            width: 100%;
            height: 60px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .ecg-svg {
            width: 100%;
            height: 100%;
            stroke: #000000;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawECG 2s linear infinite;
        }
        @keyframes drawECG {
            to {
                stroke-dashoffset: 0;
            }
        }
        body.dark-mode .ecg-svg {
            stroke: #ffffff;
        }
        /* End ECG Styles */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }
        p {
            font-size: 1.1rem;
            color: #333333;
            margin-bottom: 30px;
        }
        .role {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: block;
        }
        .contact {
            margin-top: 40px;
            border-top: 1px solid #000000;
            padding-top: 20px;
        }
        .contact a {
            color: #000000;
            text-decoration: none;
            margin: 0 15px;
            font-weight: 500;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        /* Dark Mode Styles */
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            cursor: pointer;
            font-family: inherit;
            z-index: 1000;
        }
        body.dark-mode {
            background-color: #000000;
            color: #ffffff;
        }
        body.dark-mode p {
            color: #cccccc;
        }
        body.dark-mode .contact {
            border-top: 1px solid #ffffff;
        }
        body.dark-mode .contact a {
            color: #ffffff;
        }
        body.dark-mode #theme-toggle {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>
    <button id="theme-toggle">Dark Mode</button>
    <div class="container">
        <!-- ECG Animation -->
        <div class="ecg-container">
            <svg class="ecg-svg" viewBox="0 0 500 100" preserveAspectRatio="none">
                <path d="M0,50 L50,50 L60,40 L70,60 L80,10 L90,90 L100,50 L150,50 L160,40 L170,60 L180,10 L190,90 L200,50 L500,50" />
            </svg>
        </div>
        <h1>Azlysyam Fauzi</h1>
        <span class="role">Instrument & Control Engineer</span>
        <p>
            Specializing in offshore upstream oil and gas facilities. 
            Dedicated to reliability, safety, and automation excellence.
        </p>
        <div class="contact">
            <a href="mailto:azlysyam@gmail.com">Email</a>
            <a href="https://www.linkedin.com/in/azlysyam-fauzi-55a09734/">LinkedIn</a>
        </div>
    </div>
    <script>
        const toggleButton = document.getElementById('theme-toggle');
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
        });
    </script>
</body>
</html>
